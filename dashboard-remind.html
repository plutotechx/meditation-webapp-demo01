<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>รายงานสมาธิประจำวัน</title>
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{
      font-family:'Sarabun',system-ui,-apple-system,sans-serif;
      background:#f0f4f8;
      min-height:100vh;
      padding:16px 12px 32px;
      color:#1a202c;
    }

    .page{
      max-width:480px;
      margin:0 auto;
    }

    /* ===== Header card ===== */
    .header{
      background:linear-gradient(135deg,#1a56db 0%,#3b82f6 50%,#60a5fa 100%);
      border-radius:16px;
      padding:12px 14px 12px;
      color:#fff;
      margin-bottom:12px;
      box-shadow:0 4px 16px rgba(37,99,235,.28);
    }
    .header-top{
      display:flex;
      align-items:center;
      justify-content:space-between;
      margin-bottom:7px;
    }
    .header-logo{
      font-size:16px;
      font-weight:800;
      letter-spacing:-.2px;
    }
    .header-badge{
      background:rgba(255,255,255,.20);
      border:1px solid rgba(255,255,255,.30);
      border-radius:999px;
      padding:3px 10px;
      font-size:12px;
      font-weight:700;
    }
    .header-date-sm{
      font-size:14px;
      font-weight:700;
      opacity:.92;
      white-space:nowrap;
    }
    .btn-refresh-sm{
      background:rgba(255,255,255,.20);
      border:1px solid rgba(255,255,255,.30);
      border-radius:999px;
      width:28px;height:28px;
      display:grid;place-items:center;
      cursor:pointer;
      color:#fff;
      flex:0 0 auto;
    }
    .btn-refresh-sm:hover{background:rgba(255,255,255,.30)}

    /* ===== Section cards ===== */
    .section{
      background:#fff;
      border-radius:16px;
      padding:14px 14px 12px;
      margin-bottom:10px;
      box-shadow:0 1px 6px rgba(0,0,0,.08);
      border:1px solid #e2e8f0;
    }
    .section-header{
      display:flex;
      align-items:center;
      gap:10px;
      margin-bottom:11px;
    }
    .section-icon{
      width:36px;height:36px;
      border-radius:12px;
      display:grid;place-items:center;
      font-size:18px;
      flex:0 0 auto;
    }
    .icon-green{ background:#dcfce7; }
    .icon-amber{ background:#fef9c3; }
    .icon-orange{ background:#ffedd5; }
    .icon-red{   background:#fee2e2; }

    .section-title{
      font-size:15px;
      font-weight:800;
      line-height:1.2;
    }
    .section-count{
      margin-left:auto;
      font-size:13px;
      font-weight:800;
      padding:4px 10px;
      border-radius:999px;
      white-space:nowrap;
    }
    .count-green{ background:#dcfce7; color:#166534; }
    .count-amber{ background:#fef9c3; color:#854d0e; }
    .count-orange{ background:#ffedd5; color:#9a3412; }
    .count-red{   background:#fee2e2; color:#991b1b; }

    .name-grid{
      display:flex;
      flex-wrap:wrap;
      gap:7px;
    }
    .name-chip{
      font-size:13px;
      font-weight:700;
      padding:5px 11px;
      border-radius:999px;
      white-space:nowrap;
    }
    .chip-green{ background:#dcfce7; color:#166534; border:1px solid #bbf7d0; }
    .chip-amber{ background:#fef9c3; color:#713f12; border:1px solid #fde68a; }
    .chip-orange{ background:#ffedd5; color:#9a3412; border:1px solid #fed7aa; }
    .chip-red{   background:#fee2e2; color:#991b1b; border:1px solid #fecaca; }
    .chip-empty{
      font-size:13px;
      font-weight:600;
      color:#94a3b8;
      font-style:italic;
    }


    /* ===== Loading / error ===== */
    .loading{
      text-align:center;
      padding:40px 0;
      color:#64748b;
      font-size:15px;
      font-weight:600;
    }
    .loading .spin{
      display:inline-block;
      width:28px;height:28px;
      border:3px solid #e2e8f0;
      border-top-color:#3b82f6;
      border-radius:50%;
      animation:spin .8s linear infinite;
      margin-bottom:10px;
    }
    @keyframes spin{to{transform:rotate(360deg)}}

    .upd-time{
      font-size:11px;
      font-weight:600;
      opacity:.80;
      white-space:nowrap;
    }

  </style>
</head>
<body>
<div class="page">

  <div class="header">
    <div class="header-top">
      <div style="display:flex;align-items:center;gap:10px;min-width:0;flex:1">
        <div class="header-logo">🧘 สมาธิประจำวัน</div>
        <span class="header-date-sm" id="hDate">—</span>
      </div>
      <div style="display:flex;align-items:center;gap:6px;flex:0 0 auto">
        <div class="header-badge" id="hBadge">—</div>
        <button class="btn-refresh-sm" id="btnRefresh" onclick="load()">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 2v6h-6"/><path d="M3 12a9 9 0 0 1 15-6.7L21 8"/><path d="M3 22v-6h6"/><path d="M21 12a9 9 0 0 1-15 6.7L3 16"/></svg>
        </button>
      </div>
    </div>
  </div>

  <div id="content">
    <div class="loading">
      <div class="spin"></div><br>กำลังโหลดข้อมูล...
    </div>
  </div>


</div>

<script>
  // ===== Utils =====
  function escHtml(s){ return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])) }

  function getTodayISO(){
    const d = new Date();
    return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
  }

  function thaiDate(iso){
    const [y,m,d] = iso.split('-').map(Number);
    const months = ['มกราคม','กุมภาพันธ์','มีนาคม','เมษายน','พฤษภาคม','มิถุนายน','กรกฎาคม','สิงหาคม','กันยายน','ตุลาคม','พฤศจิกายน','ธันวาคม'];
    const days   = ['อาทิตย์','จันทร์','อังคาร','พุธ','พฤหัสบดี','ศุกร์','เสาร์'];
    const dt = new Date(y, m-1, d);
    return { day: days[dt.getDay()], d: d, month: months[m-1], be: y+543 };
  }

  function nowHHmm(){
    const d = new Date();
    return `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')} น.`;
  }

  // ===== Render =====
  function render(out){
    const todayISO = getTodayISO();
    const td = thaiDate(todayISO);
    const people = out.people || [];
    const total  = people.length;

    // Categorise by today's count — 2 groups only
    const gDone=[], gLeft=[];
    for(const p of people){
      const perDay = Array.isArray(p.perDay)?p.perDay:[];
      const d = perDay.find(x=>String(x.dateISO||'')===todayISO);
      const cnt = d ? Number(d.count||0) : 0;
      if(cnt>=3) gDone.push(p.name);
      else gLeft.push(p.name);
    }

    const thSort = (a,b)=>String(a).localeCompare(String(b),'th');
    gDone.sort(thSort);
    gLeft.sort(thSort);

    // Header
    document.getElementById('hBadge').textContent = `${td.day}`;
    document.getElementById('hDate').textContent = `${td.d} ${td.month} ${td.be}`;

    // Content
    const chips = (arr, cls) =>
      arr.length
        ? arr.map(n=>`<span class="name-chip ${cls}">${escHtml(n)}</span>`).join('')
        : `<span class="chip-empty">— ไม่มี —</span>`;

    document.getElementById('content').innerHTML = `
      <div class="section">
        <div class="section-header">
          <div class="section-icon icon-green">✅</div>
          <div>
            <div class="section-title">ทำครบแล้ว</div>
            <div style="font-size:12px;color:#64748b;font-weight:600;margin-top:1px">ครบ 3/3 ครั้ง</div>
          </div>
          <span class="section-count count-green">${gDone.length} คน</span>
        </div>
        <div class="name-grid">${chips(gDone,'chip-green')}</div>
      </div>

      <div class="section">
        <div class="section-header">
          <div class="section-icon icon-red">❌</div>
          <div>
            <div class="section-title">ยังไม่ครบ</div>
            <div style="font-size:12px;color:#64748b;font-weight:600;margin-top:1px">ทำได้ 0–2 ครั้ง</div>
          </div>
          <span class="section-count count-red">${gLeft.length} คน</span>
        </div>
        <div class="name-grid">${chips(gLeft,'chip-red')}</div>
      </div>
    `;
  }

  // ===== Fetch =====
  let inFlight = false;
  let retryTimer = null;

  async function load(){
    if(inFlight) return;
    inFlight = true;
    if(retryTimer){ clearTimeout(retryTimer); retryTimer = null; }
    const btn = document.getElementById('btnRefresh');
    if(btn) btn.disabled = true;
    document.getElementById('hBadge').title = 'กำลังโหลด...';
    try{
      const res = await fetch('/api/dashboard?weekOffset=0',{cache:'no-store'});
      const out = await res.json().catch(()=>({}));
      if(!res.ok || !out.ok){
        const err = out.error || 'unknown';
        const isTimeout = /timeout|gas_timeout/i.test(err);
        const hasContent = document.getElementById('content').querySelector('.section');
        if(isTimeout){
          // timeout → retry อัตโนมัติใน 8 วินาที (เงียบๆ ถ้ามีข้อมูลแสดงอยู่แล้ว)
          document.getElementById('hBadge').title = 'กำลังลองใหม่...';
          if(!hasContent){
            document.getElementById('content').innerHTML =
              `<div class="loading" style="color:#64748b">กำลังโหลด — รอสักครู่...</div>`;
          }
          retryTimer = setTimeout(()=>{ retryTimer=null; load(); }, 8_000);
        } else {
          document.getElementById('hBadge').title = 'เกิดข้อผิดพลาด';
          if(!hasContent){
            document.getElementById('content').innerHTML =
              `<div class="loading" style="color:#ef4444">โหลดไม่สำเร็จ — กดรีเฟรชเพื่อลองใหม่</div>`;
          }
        }
        return;
      }
      render(out);
    }catch(e){
      const hasContent = document.getElementById('content').querySelector('.section');
      document.getElementById('hBadge').title = 'กำลังลองใหม่...';
      if(!hasContent){
        document.getElementById('content').innerHTML =
          `<div class="loading" style="color:#64748b">กำลังโหลด — รอสักครู่...</div>`;
      }
      retryTimer = setTimeout(()=>{ retryTimer=null; load(); }, 8_000);
    }finally{
      inFlight = false;
      if(btn) btn.disabled = false;
    }
  }

  load();
</script>
</body>
</html>
